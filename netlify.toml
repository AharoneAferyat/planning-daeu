[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  # L'adresse d'envoi des mails est volontairement affichée sur le site : ce n'est pas un secret
  SECRETS_SCAN_OMIT_KEYS = "GMAIL_USER"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Mails automatiques (dossier netlify/functions)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]
